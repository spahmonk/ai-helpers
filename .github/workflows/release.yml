name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: macOS
            runner: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ctx-lite.exe
            artifact_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: repo/modules/ctx-lite

      - name: Build release binary
        working-directory: repo/modules/ctx-lite
        run: cargo build --release --bin ctx-lite

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        working-directory: repo/modules/ctx-lite
        run: strip target/release/ctx-lite || true

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        working-directory: repo/modules/ctx-lite
        run: |
          version="${{ github.ref }}" && version="${version#refs/tags/v}"
          tar czf ctx-lite-${version}-${{ matrix.target }}.tar.gz -C target/release ctx-lite
          ls -lh ctx-lite-${version}-${{ matrix.target }}.tar.gz

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        working-directory: repo/modules/ctx-lite
        shell: powershell
        run: |
          $version = "${{ github.ref }}".substring("refs/tags/v".length)
          $archive = "ctx-lite-${version}-${{ matrix.target }}.zip"
          7z a $archive target/release/ctx-lite.exe
          Get-Item $archive | Format-List Length

      - name: Test binary
        working-directory: repo/modules/ctx-lite
        run: ./target/release/${{ matrix.artifact_name }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: repo/modules/ctx-lite/ctx-lite-*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: modules/ctx-lite
        run: npm install

      - name: Publish to npm
        working-directory: modules/ctx-lite
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
