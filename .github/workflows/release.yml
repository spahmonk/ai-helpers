name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: macOS
            runner: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ctx-lite.exe
            artifact_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: repo/modules/ctx-lite

      - name: Build release binary
        working-directory: repo/modules/ctx-lite
        run: |
          cargo clean
          cargo build --release --bin ctx-lite --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        working-directory: repo/modules/ctx-lite
        run: |
          strip target/${{ matrix.target }}/release/ctx-lite || true

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        working-directory: repo/modules/ctx-lite
        run: |
          version="${{ github.ref }}" && version="${version#refs/tags/v}"
          tar czf ctx-lite-${version}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release ctx-lite
          ls -lh ctx-lite-${version}-${{ matrix.target }}.tar.gz

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        working-directory: repo/modules/ctx-lite
        shell: powershell
        run: |
          $version = "${{ github.ref }}".substring("refs/tags/v".length)
          $archive = "ctx-lite-${version}-${{ matrix.target }}.zip"
          7z a $archive target/${{ matrix.target }}/release/ctx-lite.exe
          Get-Item $archive | Format-List Length

      - name: Test binary
        working-directory: repo/modules/ctx-lite
        run: ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: repo/modules/ctx-lite/ctx-lite-*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "ctx-lite-*"
          bodyFile: null
          body: |
            # Release ${{ github.ref_name }}

            ## Installation

            Download the binary for your platform from the assets below.

            - **Linux (x86_64)**: `ctx-lite-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz`
            - **macOS (x86_64)**: `ctx-lite-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz`
            - **macOS (ARM64)**: `ctx-lite-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz`
            - **Windows (x86_64)**: `ctx-lite-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip`

            See [INSTALL.md](https://github.com/spahmonk/ai-helpers/blob/feature/ctx-lite-mcp/docs/INSTALL.md) for installation instructions.

            ## Verification

            To verify the binary works:

            ```bash
            # Linux/macOS
            tar xzf ctx-lite-*.tar.gz
            ./ctx-lite --help

            # Windows
            Expand-Archive -Path ctx-lite-*.zip
            .\ctx-lite.exe --help
            ```

            ## Changes

            See [CHANGELOG.md](https://github.com/spahmonk/ai-helpers/blob/feature/ctx-lite-mcp/CHANGELOG.md) for details.
