name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: macOS
            runner: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ctx-lite
            artifact_ext: tar.gz

          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ctx-lite.exe
            artifact_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: repo

      - name: Build release binary
        working-directory: repo
        run: cargo build -p ctx-lite --release --bin ctx-lite

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        working-directory: repo
        run: strip target/release/ctx-lite || true

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        working-directory: repo
        run: |
          version="${{ github.ref }}" && version="${version#refs/tags/v}"
          tar czf ctx-lite-${version}-${{ matrix.target }}.tar.gz -C target/release ctx-lite
          ls -lh ctx-lite-${version}-${{ matrix.target }}.tar.gz
          cp ctx-lite-${version}-${{ matrix.target }}.tar.gz $GITHUB_WORKSPACE/

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        working-directory: repo
        shell: powershell
        run: |
          $version = "${{ github.ref }}".substring("refs/tags/v".length)
          $archive = "ctx-lite-${version}-${{ matrix.target }}.zip"
          7z a $archive target/release/ctx-lite.exe
          Get-Item $archive | Format-List Length
          Copy-Item $archive -Destination $env:GITHUB_WORKSPACE/

      - name: Test binary
        working-directory: repo
        run: ./target/release/${{ matrix.artifact_name }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: ctx-lite-*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release and Publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: artifacts

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${{ github.ref_name }}"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" artifacts/* --clobber
          else
            gh release create "$version" artifacts/* --title "$version" --generate-notes
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update package.json version
        run: |
          VERSION="${{ github.ref_name }}"
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          cat package.json | grep -A 1 '"version"'

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Release pipeline summary"
            echo
            echo "- Tag: \`${{ github.ref_name }}\`"
            echo "- Release assets: uploaded from matrix artifacts"
            echo "- npm package: \`@spahmonk/ctx-lite\`"
          } >> "$GITHUB_STEP_SUMMARY"
