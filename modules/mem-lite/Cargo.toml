[package]
name = "mem-lite"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mem_lite"
path = "src/lib.rs"

[[bin]]
name = "mem-lite"
path = "src/main.rs"

[dependencies]
hex = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
