[package]
name = "ctx-lite"
version = "1.0.6"
edition = "2021"
publish = false

[lib]
name = "ctx_lite"
path = "src/lib.rs"

[[bin]]
name = "ctx-lite"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
